name: Midi Health
description: 'Midi Health is a virtual care platform for women in midlife, delivering
  insurance-covered telemedicine from clinicians who specialize in perimenopause,
  menopause, and related midlife health. Patients get personalized care plans spanning
  hormone therapy (HRT), GLP-1 and weight management, sexual wellness, mood, sleep,
  hair and skin, and cancer-survivorship care, plus prescriptions, compounded medications,
  and supplements, with coverage available across all 50 states. Backed by GV (Google
  Ventures), Midi operates as a direct-to-consumer and employer/health-plan telehealth
  service. No public API, developer portal, or technical developer surface was found
  during enrichment.'
